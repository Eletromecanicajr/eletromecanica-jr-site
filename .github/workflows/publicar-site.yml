name: Publicar site Eletromecânica JR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do site
        uses: actions/checkout@v4
      - name: Manter apenas o link Fotos do menu original
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove somente o atalho azul criado por publicações anteriores.
          s = re.sub(r'<a\b(?=[^>]*\bdata-fotos-jr\s*=)[^>]*>.*?</a\s*>', '', s, flags=re.I | re.S)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Destacar plantão industrial 24 horas na página inicial
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-jr-plantao-home="1"'
          if marker not in s:
              css = """<style id="jr-plantao-home-css">
              .jr-plantao-home{background:linear-gradient(110deg,#102c40,#163d51);border-top:1px solid #315068;border-bottom:1px solid #315068;color:#eef6fb;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
              .jr-plantao-home-wrap{max-width:1160px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
              .jr-plantao-home-copy strong{display:block;color:#ffc44b;font-size:clamp(20px,2.7vw,30px);line-height:1.25}
              .jr-plantao-home-copy span{display:block;margin-top:6px;font-size:15px;line-height:1.5}
              .jr-plantao-home-actions{display:flex;flex-wrap:wrap;gap:9px}
              .jr-plantao-home-actions a{background:#ffc44b;color:#08121e;text-decoration:none;border-radius:8px;font-size:14px;font-weight:800;padding:12px 16px}
              .jr-plantao-home-actions a:last-child{background:transparent;color:#fff;border:1px solid #9bbbd0}
              @media(max-width:640px){.jr-plantao-home-wrap{padding:16px}.jr-plantao-home-actions{width:100%}.jr-plantao-home-actions a{flex:1;text-align:center;font-size:12px;padding:12px 8px}}
              @media(min-width:850px){
                .jr-plantao-home-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.95fr);grid-template-rows:auto auto;align-items:center;gap:10px 20px;min-height:380px}
                .jr-plantao-home-copy{grid-column:1;grid-row:1;align-self:end}
                .jr-plantao-home-actions{grid-column:1;grid-row:2;align-self:start}
                .jr-plantao-home-map{grid-column:2;grid-row:1 / span 2}
              }
              .jr-plantao-home-map{display:block;min-width:0;text-align:center}
              .jr-plantao-home-map img{display:block;width:100%;max-width:540px;height:auto;margin:auto;filter:drop-shadow(0 7px 22px #001626)}
              .jr-plantao-home-map figcaption{font-size:12px;color:#bbd0e3;line-height:1.45;margin-top:-6px}
              @media(max-width:849px){
                .jr-plantao-home-wrap{display:flex;flex-direction:column;align-items:stretch;gap:12px}
                .jr-plantao-home-map{margin:0 auto;width:100%;max-width:560px}
                .jr-plantao-home-map img{max-width:100%}
              }
              </style>"""
              banner = """<section class="jr-plantao-home" data-jr-plantao-home="1" aria-label="Atendimento industrial 24 horas">
              <div class="jr-plantao-home-wrap"><div class="jr-plantao-home-copy">
              <strong>A indústria não pode parar. Nossa assistência também não!</strong>
              <span>⚡ Atendimento industrial 24 horas, inclusive finais de semana e feriados — Campo Verde e região.</span></div>
              <div class="jr-plantao-home-actions"><a href="tel:+5566996406718">Ligar: (66) 99640-6718</a><a href="https://wa.me/5516993104742" target="_blank" rel="noopener noreferrer">Orçamentos pelo WhatsApp</a></div>
              <figure class="jr-plantao-home-map"><img src="/mapa-atuacao-jr.svg" alt="Mapa do Brasil: Campo Verde em destaque, conectada a Cuiabá, Várzea Grande, Chapada dos Guimarães, Paranatinga, Primavera do Leste, Poxoréu, Jaciara e Rondonópolis" width="620" height="620" loading="eager" decoding="async"><figcaption>Campo Verde–MT e principais cidades da região · Consulte atendimento em outras localidades</figcaption></figure></div></section>"""
              if re.search(r'</head\s*>', s, flags=re.I):
                  s = re.sub(r'</head\s*>', lambda m: css + m.group(0), s, count=1, flags=re.I)
              else:
                  raise RuntimeError('Não foi possível localizar o fechamento do head no index.html')
              if re.search(r'</header\s*>', s, flags=re.I):
                  s = re.sub(r'</header\s*>', lambda m: m.group(0) + banner, s, count=1, flags=re.I)
              elif re.search(r'<body\b[^>]*>', s, flags=re.I):
                  s = re.sub(r'<body\b[^>]*>', lambda m: m.group(0) + banner, s, count=1, flags=re.I)
              else:
                  raise RuntimeError('Não foi possível localizar o cabeçalho ou body no index.html')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Aplicar fundo timbrado de circuito integrado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = """<style id="jr-circuito-timbrado">
          .jr-plantao-home {
            background-color:#103247;
            background-image:linear-gradient(100deg,rgba(10,37,55,.86),rgba(14,47,67,.70)),url('/circuito-timbrado-jr.svg');
            background-size:cover, min(1200px, 100%) auto;
            background-repeat:no-repeat, repeat;
            background-position:center,center;
          }
          @media(max-width:849px){
            .jr-plantao-home{
              background-image:linear-gradient(180deg,rgba(10,36,54,.88),rgba(12,43,62,.75)),url('/circuito-timbrado-jr.svg');
              background-size:cover, 760px auto;
            }
          }
          </style>"""
          s = re.sub(r'<style id="jr-circuito-timbrado">.*?</style>', '', s, flags=re.I|re.S)
          s, n = re.subn(r'</head\s*>', lambda m: css + m.group(0), s, count=1, flags=re.I)
          if n != 1:
              raise RuntimeError('Head não encontrado para adicionar fundo timbrado')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
