          js="""<script id="jr-band-bridge-js">
          (function(){
            var band=document.querySelector('.jr-credibilidade'),hero=document.querySelector('.jr-plantao-home');
            if(!band||!hero)return;
            var layer=document.createElement('div');layer.id='jr-band-bridge';layer.setAttribute('aria-hidden','true');
            layer.innerHTML='<svg viewBox="0 0 1200 100" preserveAspectRatio="none" focusable="false"></svg>';
            band.prepend(layer);
            var svg=layer.firstElementChild,ns='http://www.w3.org/2000/svg',groups=[];
            var routes=['M24 100 V84 L48 68 H220 L240 48 H360 V0','M57 100 V90 L84 76 H310 L330 56 H510 V0','M90 100 V94 L118 82 H150 L172 60 H270 V34 L290 14 H690 V0','M1176 100 V84 L1152 68 H980 L960 48 H840 V0','M1143 100 V90 L1116 76 H890 L870 56 H690 V0','M1110 100 V94 L1082 82 H1050 L1028 60 H930 V34 L910 14 H510 V0'];
            routes.forEach(function(d,i){
              var p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','#58bedf');p.setAttribute('stroke-width','1.5');p.setAttribute('opacity','.46');p.setAttribute('vector-effect','non-scaling-stroke');svg.append(p);
              var c=document.createElementNS(ns,'circle');c.setAttribute('r','2.8');c.setAttribute('fill',i%3===1?'#ffe2a0':'#b9f3ff');svg.append(c);
              groups.push({p:p,c:c,len:p.getTotalLength(),phase:i*.19});
            });
            var control=document.querySelector('.jr-map-desktop-toggle'),desktop=matchMedia('(min-width:850px)'),frame=0,visible=true;
            function active(){return visible&&desktop.matches&&!document.hidden&&(!control||control.getAttribute('aria-pressed')!=='false');}
            function tick(t){frame=0;if(!active())return;groups.forEach(function(g){var q=g.p.getPointAtLength(((t/5800+g.phase)%1)*g.len);g.c.setAttribute('cx',q.x);g.c.setAttribute('cy',q.y);});frame=requestAnimationFrame(tick);}
            function sync(){var on=active();layer.classList.toggle('jr-band-running',on);if(on&&!frame)frame=requestAnimationFrame(tick);if(!on&&frame){cancelAnimationFrame(frame);frame=0;}}
            if(control)control.addEventListener('click',sync);document.addEventListener('visibilitychange',sync);window.addEventListener('resize',sync);
            if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;sync();}).observe(band);
            sync();
          })();
          </script>"""
