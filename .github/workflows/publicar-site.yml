name: Publicar site Eletromecânica JR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do site
        uses: actions/checkout@v4
      - name: Manter apenas o link Fotos do menu original
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove somente o atalho azul criado por publicações anteriores.
          s = re.sub(r'<a\b(?=[^>]*\bdata-fotos-jr\s*=)[^>]*>.*?</a\s*>', '', s, flags=re.I | re.S)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Destacar plantão industrial 24 horas na página inicial
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-jr-plantao-home="1"'
          if marker not in s:
              css = """<style id="jr-plantao-home-css">
              .jr-plantao-home{background:linear-gradient(110deg,#102c40,#163d51);border-top:1px solid #315068;border-bottom:1px solid #315068;color:#eef6fb;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
              .jr-plantao-home-wrap{max-width:1160px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
              .jr-plantao-home-copy strong{display:block;color:#ffc44b;font-size:clamp(20px,2.7vw,30px);line-height:1.25}
              .jr-plantao-home-copy span{display:block;margin-top:6px;font-size:15px;line-height:1.5}
              .jr-plantao-home-actions{display:flex;flex-wrap:wrap;gap:9px}
              .jr-plantao-home-actions a{background:#ffc44b;color:#08121e;text-decoration:none;border-radius:8px;font-size:14px;font-weight:800;padding:12px 16px}
              .jr-plantao-home-actions a:last-child{background:transparent;color:#fff;border:1px solid #9bbbd0}
              @media(max-width:640px){.jr-plantao-home-wrap{padding:16px}.jr-plantao-home-actions{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.jr-plantao-home-actions a{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;min-width:0;text-align:center;font-size:clamp(13px,3.7vw,16px);line-height:1.35;padding:13px 12px;white-space:normal;overflow-wrap:normal}}
              @media(min-width:850px){
                .jr-plantao-home-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.95fr);grid-template-rows:auto auto;align-items:center;gap:10px 20px;min-height:380px}
                .jr-plantao-home-copy{grid-column:1;grid-row:1;align-self:end}
                .jr-plantao-home-actions{grid-column:1;grid-row:2;align-self:start}
                .jr-plantao-home-map{grid-column:2;grid-row:1 / span 2}
              }
              .jr-plantao-home-map{display:block;min-width:0;text-align:center}
              .jr-plantao-home-map img{display:block;width:100%;max-width:540px;height:auto;margin:auto;filter:drop-shadow(0 7px 22px #001626)}
              .jr-plantao-home-map figcaption{font-size:12px;color:#bbd0e3;line-height:1.45;margin-top:-6px}
              @media(max-width:849px){
                .jr-plantao-home-wrap{display:flex;flex-direction:column;align-items:stretch;gap:12px}
                .jr-plantao-home-map{margin:0 auto;width:100%;max-width:560px}
                .jr-plantao-home-map img{max-width:100%}
              }
              </style>"""
              banner = """<section class="jr-plantao-home" data-jr-plantao-home="1" aria-label="Atendimento industrial 24 horas">
              <div class="jr-plantao-home-wrap"><div class="jr-plantao-home-copy">
              <strong>A indústria não pode parar. Nossa assistência também não!</strong>
              <span>⚡ Atendimento industrial 24 horas, inclusive finais de semana e feriados — Campo Verde e região.</span></div>
              <div class="jr-plantao-home-actions"><a href="tel:+5566996406718">Ligar: (66) 99640-6718</a><a href="https://wa.me/5566996406718" target="_blank" rel="noopener noreferrer">Orçamentos pelo WhatsApp</a></div>
              <figure class="jr-plantao-home-map"><img src="/mapa-atuacao-jr.svg" alt="Mapa do Brasil: Campo Verde em destaque, conectada a Cuiabá, Várzea Grande, Chapada dos Guimarães, Paranatinga, Primavera do Leste, Poxoréu, Jaciara e Rondonópolis" width="620" height="620" loading="eager" decoding="async"><figcaption>Campo Verde–MT e principais cidades da região · Consulte atendimento em outras localidades</figcaption></figure></div></section>"""
              if re.search(r'</head\s*>', s, flags=re.I):
                  s = re.sub(r'</head\s*>', lambda m: css + m.group(0), s, count=1, flags=re.I)
              else:
                  raise RuntimeError('Não foi possível localizar o fechamento do head no index.html')
              if re.search(r'</header\s*>', s, flags=re.I):
                  s = re.sub(r'</header\s*>', lambda m: m.group(0) + banner, s, count=1, flags=re.I)
              elif re.search(r'<body\b[^>]*>', s, flags=re.I):
                  s = re.sub(r'<body\b[^>]*>', lambda m: m.group(0) + banner, s, count=1, flags=re.I)
              else:
                  raise RuntimeError('Não foi possível localizar o cabeçalho ou body no index.html')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Aplicar fundo timbrado de circuito integrado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = """<style id="jr-circuito-timbrado">
          .jr-plantao-home {
            background-color:#103247;
            background-image:linear-gradient(100deg,rgba(10,37,55,.86),rgba(14,47,67,.70)),url('/circuito-timbrado-jr.svg');
            background-size:cover, min(1200px, 100%) auto;
            background-repeat:no-repeat, repeat;
            background-position:center,center;
          }
          @media(max-width:849px){
            .jr-plantao-home{
              background-image:linear-gradient(180deg,rgba(10,36,54,.88),rgba(12,43,62,.75)),url('/circuito-timbrado-jr.svg');
              background-size:cover, 760px auto;
            }
          }
          </style>"""
          s = re.sub(r'<style id="jr-circuito-timbrado">.*?</style>', '', s, flags=re.I|re.S)
          s, n = re.subn(r'</head\s*>', lambda m: css + m.group(0), s, count=1, flags=re.I)
          if n != 1:
              raise RuntimeError('Head não encontrado para adicionar fundo timbrado')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Sinalizar menu mobile com seta discreta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Dica apenas visual; não interfere no clique do menu.
          css = """<style id="jr-menu-dica-css">
          @media(max-width:850px){
            .jr-menu-dica-alvo{position:relative!important;isolation:isolate}
            .jr-menu-dica-alvo::after{
              content:"MENU ↓";
              position:absolute;top:2px;left:50%;transform:translateX(-50%);
              width:max-content;max-width:100%;box-sizing:border-box;
              color:#ffc44b;background:transparent;
              font:800 9px/1.15 system-ui,sans-serif;
              letter-spacing:.025em;z-index:2;pointer-events:none;
              white-space:nowrap;
            }
            .jr-menu-dica-alvo svg,.jr-menu-dica-alvo .hamburger,.jr-menu-dica-alvo .hamburger-icon{
              transform:translateY(6px);
            }
            .jr-menu-dica-alvo.jr-menu-dica-oculta::after{display:none}
          }
          @media(min-width:851px){.jr-menu-dica-alvo::after{display:none}}
          </style>"""
          js = """<script id="jr-menu-dica-js">
          (function(){
            function init(){
              var header=document.querySelector('header');
              if(!header)return;
              var controls=Array.from(header.querySelectorAll('button, [role="button"], summary, input[type="checkbox"] + label'));
              var btn=controls.find(function(el){
                var a=[el.getAttribute('aria-label'),el.getAttribute('title'),el.id,el.className,el.textContent].join(' ');
                return /menu|hamburg|nav.toggle|toggle.nav|abrir navega/i.test(a);
              });
              if(!btn){
                btn=controls.find(function(el){
                  return el.querySelector('svg, .hamburger, .hamburger-icon, [class*="bar"], [class*="line"]') &&
                    !/orçamento|whatsapp|ligar/i.test(el.textContent || '');
                });
              }
              if(!btn)return;
              btn.classList.add('jr-menu-dica-alvo');
              btn.addEventListener('click',function(){btn.classList.add('jr-menu-dica-oculta')},{once:true});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
            else init();
          })();
          </script>"""
          s=re.sub(r'<style id="jr-menu-dica-css">.*?</style>', '', s, flags=re.I|re.S)
          s=re.sub(r'<script id="jr-menu-dica-js">.*?</script>', '', s, flags=re.I|re.S)
          s,n=re.subn(r'</head\s*>',lambda m:css+m.group(0),s,count=1,flags=re.I)
          if n!=1: raise RuntimeError('Não foi possível inserir CSS da dica no head')
          s,n=re.subn(r'</body\s*>',lambda m:js+m.group(0),s,count=1,flags=re.I)
          if n!=1: raise RuntimeError('Não foi possível inserir JS da dica no body')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verificar destaque SPDA na galeria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fotos.html')
          s = p.read_text(encoding='utf-8')
          if 'class="spda-banner"' in s:
              print('Destaque SPDA já está no arquivo, preservado.')
          else:
              anchor = '<main><p class="lead">'
              if anchor not in s:
                  raise RuntimeError('Não foi localizado o local do destaque SPDA')
              link = ('<main><a class="spda-banner" href="spda.html" style="display:block;padding:20px;'
                      'margin:0 0 24px;border:1px solid #d9ab53;border-radius:14px;background:#143852;'
                      'color:#f1c76e;text-decoration:none;font-weight:800;font-size:20px">'
                      'Projetos de SPDA e Aterramento — Conheça nosso portfólio técnico — CLIQUE AQUI</a>'
                      '<p class="lead">')
              p.write_text(s.replace(anchor, link, 1), encoding='utf-8')
          PY
      - name: Destacar contadores em telas pequenas e atualizar cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = """<style id="jr-contadores-mobile-css">
          @media(max-width:849px){
            .jr-credibilidade .jr-cred-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 38px}
            .jr-credibilidade .jr-cred-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;text-align:center}
            .jr-credibilidade .jr-cred-num{font-size:clamp(23px,6vw,36px);line-height:1.1;font-variant-numeric:tabular-nums}
            .jr-credibilidade .jr-cred-desc{font-size:clamp(11px,3vw,14px);line-height:1.25}
            .jr-credibilidade .jr-cred-desc small{font-size:10px}
            .jr-credibilidade .jr-cred-divider{display:none}
          }
          </style>"""
          script = """<script id="jr-contadores-mobile-js">
          (function(){
            var band=document.querySelector('.jr-credibilidade'), banner=document.querySelector('.jr-plantao-home');
            if(!band||!banner||band.parentNode!==banner.parentNode)return;
            var mobile=window.matchMedia('(max-width:849px)');
            function place(){
              if(mobile.matches){if(band.nextElementSibling!==banner)banner.before(band);}
              else if(banner.nextElementSibling!==band){banner.after(band);}
            }
            place();
            if(mobile.addEventListener)mobile.addEventListener('change',place);
            else if(mobile.addListener)mobile.addListener(place);
          })();
          </script>"""
          assert 'jr-atendimento.js?v=20261125-gaveta2' in s
          s = s.replace('jr-atendimento.js?v=20261125-gaveta2','jr-atendimento.js?v=20261127-contadores4',1)
          s = s.replace('/mapa-atuacao-jr.svg','/mapa-atuacao-jr.svg?v=20261127-pulsos4')
          s = s.replace('/circuito-timbrado-jr.svg','/circuito-timbrado-jr.svg?v=20261127-luzes4')
          assert '</head>' in s and '</body>' in s and 'class="jr-credibilidade"' in s
          s = s.replace('</head>',css+'</head>',1).replace('</body>',script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Repaginar a experiência mobile da JR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = """<style id="jr-mobile-v5">
          @media(max-width:849px){
            .site-header{height:62px}
            .site-header .header-inner{gap:10px;width:calc(100% - 30px)}
            .site-header .brand{gap:10px;min-width:0}
            .site-header .brand-mark{width:35px;height:35px;flex:0 0 35px}
            .site-header .chip-text{font-size:16px}
            .site-header .brand-name strong{font-size:clamp(12px,3.8vw,19px)}
            .site-header .brand-name small{font-size:clamp(5px,1.35vw,7px);margin-top:3px}
            .site-header .menu-toggle{width:42px;height:42px;flex:0 0 42px}
            .site-header .nav{top:61px;max-height:calc(100dvh - 120px);overflow:auto}
            .jr-credibilidade .jr-cred-wrap{padding:8px 14px;gap:8px}
            .jr-credibilidade .jr-cred-item{gap:3px}
            .jr-credibilidade .jr-cred-num{font-size:clamp(21px,5.6vw,31px)}
            .jr-credibilidade .jr-cred-desc{font-size:11px}
            .jr-credibilidade .jr-cred-desc small{font-size:9px}
            .jr-plantao-home .jr-plantao-home-wrap{padding:15px 16px 16px;gap:10px}
            .jr-plantao-home .jr-plantao-home-copy strong{font-size:clamp(20px,5.4vw,29px);line-height:1.2}
            .jr-plantao-home .jr-plantao-home-copy span{font-size:clamp(12px,3.3vw,15px);line-height:1.45;margin-top:5px}
            .jr-plantao-home .jr-plantao-home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%}
            .jr-plantao-home .jr-plantao-home-actions a{font-size:clamp(11px,3vw,14px);display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 6px;text-align:center;line-height:1.25;white-space:normal}
            .jr-plantao-home #jr-diagnostico-launch{grid-column:1/-1;padding:9px 11px!important;min-height:44px;font-size:clamp(12px,3.5vw,15px)!important}
            .jr-plantao-home #jr-diagnostico-launch small{font-size:11px!important;margin-top:2px!important}
            .jr-plantao-home .jr-plantao-home-map{max-width:460px;width:100%;margin:0 auto}
            .jr-plantao-home .jr-plantao-home-map img{width:100%;max-width:460px;height:auto}
            .jr-plantao-home .jr-plantao-home-map figcaption{font-size:10px;line-height:1.35;margin-top:0}
          }
          @media(max-width:700px){
            body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
            #jr-mobile-dock{position:fixed;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom,0px));background:#081a2cf2;border-top:1px solid #36556d;z-index:96;pointer-events:none}
            .jr-yt-widget{left:calc(8.333vw - 22px)!important;bottom:calc(7px + env(safe-area-inset-bottom,0px))!important;width:220px;max-width:calc(100vw - 20px)}
            .jr-yt-widget .jr-yt-launcher,#jr-weather #jr-weather-launch,#jr-atendimento .jr-a-tab,#jr-utility-drawers .jru-tab{box-sizing:border-box;width:44px!important;min-width:44px!important;max-width:44px!important;height:44px!important;min-height:44px!important;max-height:44px!important;padding:0!important;display:flex;align-items:center;justify-content:center;gap:0!important;border:1px solid #b99449!important;border-radius:11px!important;font-size:19px!important}
            .jr-yt-launcher #jr-yt-label,#jr-weather #jr-weather-launch span,#jr-atendimento .jr-a-tab span,#jr-utility-drawers .jru-tab span{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important}
            .jr-yt-widget .jr-yt-panel:not([hidden]) + .jr-yt-launcher{display:none!important}
            .jr-yt-widget .jr-yt-panel{margin-bottom:4px}
            #jr-weather{left:calc(25vw - 22px)!important;bottom:calc(7px + env(safe-area-inset-bottom,0px))!important}
            #jr-atendimento{left:calc(41.667vw - 22px)!important;top:auto!important;bottom:calc(7px + env(safe-area-inset-bottom,0px))!important;flex-direction:column;align-items:center}
            #jr-atendimento .jr-a-tab b{font-size:0!important} #jr-atendimento .jr-a-tab b::after{content:"☎";font-size:22px;line-height:1}
            #jr-atendimento .jr-a-drawer{position:fixed!important;left:10px!important;top:auto!important;bottom:calc(62px + env(safe-area-inset-bottom,0px))!important;width:min(290px,calc(100vw - 20px))!important;max-height:calc(100dvh - 140px)!important;border:1px solid #f7be40;border-radius:12px}
            #jr-utility-drawers{left:calc(58.333vw - 22px)!important;right:auto!important;top:auto!important;bottom:calc(7px + env(safe-area-inset-bottom,0px))!important;transform:none!important}
            #jr-utility-drawers .jru-rail{display:contents!important;pointer-events:none!important}
            #jr-utility-drawers .jru-tab{position:fixed!important;bottom:calc(7px + env(safe-area-inset-bottom,0px))!important;top:auto!important;right:auto!important;transform:none!important;pointer-events:auto!important;touch-action:manipulation;z-index:2}
            #jr-utility-drawers .jru-tab[aria-controls="jru-google"]{left:calc(58.333vw - 22px)!important}
            #jr-utility-drawers .jru-tab[aria-controls="jru-finance"]{left:calc(75vw - 22px)!important}
            #jr-utility-drawers .jru-panel:not([hidden]){left:10px!important;right:10px!important;top:auto!important;width:auto!important;pointer-events:auto!important;z-index:3}
            #jr-atendimento .jr-a-tab{pointer-events:auto!important;touch-action:manipulation}
            #jr-utility-drawers .jru-panel{position:fixed!important;right:10px!important;bottom:calc(62px + env(safe-area-inset-bottom,0px))!important;width:min(360px,calc(100vw - 20px))!important;max-height:calc(100dvh - 140px)!important;border-radius:12px}
            .floating-whatsapp{right:calc(8.333vw - 22px)!important;bottom:calc(7px + env(safe-area-inset-bottom,0px))!important;width:44px!important;height:44px!important;box-sizing:border-box}
            .floating-whatsapp svg{width:25px;height:25px}
          }
          </style>"""
          js = """<script id="jr-mobile-v5-js">
          (function(){
            var dock=document.createElement('div');dock.id='jr-mobile-dock';dock.setAttribute('aria-hidden','true');document.body.append(dock);
            function names(){
              var a=document.querySelector('#jr-atendimento .jr-a-tab');
              if(a)a.title='Atendimento';
              var m=document.querySelector('#jr-yt-launcher');if(m)m.title='Música';
              var c=document.querySelector('#jr-weather-launch');if(c)c.title='Clima e tempo';
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',names,{once:true});else names();
          })();
          </script>"""
          assert '</head>' in s and '</body>' in s
          s=s.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Animar mapa diretamente na página desktop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = Path('mapa-atuacao-jr.svg').read_text(encoding='utf-8')
          routes = re.findall(r'<path class="jr-energy" d="([^"]+)"', original)
          assert len(routes) == 8
          static, n = re.subn(r'<g class="jr-energy-layer"[^>]*>.*?(?=<circle class="pulse")', '', original, count=1, flags=re.S)
          assert n == 1 and '<animateMotion' not in static
          Path('mapa-atuacao-jr-desktop.svg').write_text(static, encoding='utf-8')
          layers = ''.join('<g class="jr-desktop-energy"><path d="'+d+'" fill="none" stroke="none"/><circle r="8" fill="#ffbe38" opacity=".30"/><circle r="4.6" fill="#fff7d6" stroke="#ffc44b" stroke-width="2"/></g>' for d in routes)
          svg = '<svg class="jr-map-desktop-overlay" viewBox="0 0 620 620" aria-hidden="true" focusable="false">'+layers+'</svg>'
          def wrap(m):
              return '<div class="jr-map-picture"><picture><source media="(min-width:850px)" srcset="/mapa-atuacao-jr-desktop.svg?v=20261127-desktop7">'+m.group(0)+'</picture>'+svg+'</div>'
          s, n = re.subn(r'<img\b[^>]*\bsrc="/mapa-atuacao-jr\.svg[^"]*"[^>]*>',wrap,s,count=1)
          assert n == 1
          css = """<style id="jr-map-desktop-css">
          .jr-map-picture{position:relative;width:100%;max-width:540px;margin:auto}
          .jr-map-picture picture{display:block}
          .jr-map-desktop-overlay,.jr-map-desktop-toggle{display:none}
          @media(min-width:850px){
            .jr-map-desktop-overlay{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden;visibility:hidden}
