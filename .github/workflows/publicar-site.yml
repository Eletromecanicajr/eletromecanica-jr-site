            });
            var reduced=window.matchMedia('(prefers-reduced-motion:reduce)'), control=document.querySelector('.jr-map-desktop-toggle');
            var frame=0,scrollFrame=0,last=-100,visible=false;
            function active(){return visible&&!document.hidden&&(!control||control.getAttribute('aria-pressed')!=='false');}
            function tick(t){
              frame=0;
              if(!active())return;
              if(t-last>=34){
                groups.forEach(function(g,i){
                  var period=(reduced.matches?12500:7600)+i%3*550;
                  var point=g.p.getPointAtLength(((t/period+g.phase)%1)*g.len);
                  g.dots.forEach(function(c){c.setAttribute('cx',point.x);c.setAttribute('cy',point.y);});
                });
                last=t;
              }
